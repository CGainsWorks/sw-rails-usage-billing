name: CI

# Everything runs in one job on one runner. Five parallel jobs each paid for
# their own checkout and bundle install, which is about four wasted minutes per
# push on a plan with a monthly minute budget.
on:
  push:
    branches: [ main ]
    paths-ignore: [ "**/*.md", "docs/**", "LICENSE" ]
  pull_request:
    paths-ignore: [ "**/*.md", "docs/**", "LICENSE" ]
  workflow_dispatch:

# A newer push supersedes an older one rather than running beside it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, scan, test and end to end
    runs-on: ubuntu-24.04
    # Nothing here takes four minutes, so a job still running after fifteen is
    # hung and should be stopped before it eats the budget.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meterly
          POSTGRES_PASSWORD: meterly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meterly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Stripe's own API emulator. It validates every request against Stripe's
      # OpenAPI specification, so the Stripe gateway is exercised through the
      # official gem without an account or a key. Pinned to the release whose
      # API version matches the stripe gem in Gemfile.lock.
      stripe:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111

    env:
      DB_HOST: localhost
      DB_USERNAME: meterly
      DB_PASSWORD: meterly
      # The lockfile is the contract: fail rather than resolve gems afresh.
      BUNDLE_FROZEN: "true"
      STRIPE_MOCK_URL: http://localhost:12111

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          # The same patch release as the production image.
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install libpq only if the runner image lacks it
        run: |
          dpkg -s libpq-dev > /dev/null 2>&1 && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpq-dev

      # Throwaway values made for this run only. stripe-mock accepts any
      # sk_test_ key and the webhook secret only has to match between the
      # signer and the receiver, so nothing secret is committed or stored.
      - name: Generate throwaway Stripe credentials
        run: |
          key="sk_test_$(openssl rand -hex 16)"
          secret="whsec_$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          echo "STRIPE_API_KEY=$key" >> "$GITHUB_ENV"
          echo "STRIPE_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Scan for common Rails security vulnerabilities
        run: bin/brakeman --no-pager --quiet --exit-on-warn --exit-on-error

      - name: Scan dependencies for known vulnerabilities
        run: |
          bin/bundler-audit
          bin/importmap audit

      # db:test:prepare rather than db:prepare: the latter runs db/seeds.rb when
      # it creates the database, which would fill the test database with demo
      # data.
      - name: Run the test suite
        env:
          RAILS_ENV: test
        run: |
          for _ in $(seq 1 30); do
            curl -s -o /dev/null -u "$STRIPE_API_KEY:" "$STRIPE_MOCK_URL/v1/customers" && break
            sleep 1
          done
          bin/rails db:test:prepare
          bundle exec rspec --format progress

      # The web process and the worker collect through the Stripe gateway here,
      # pointed at stripe-mock, so the whole pipeline runs through the official
      # client over HTTP.
      - name: Run the end to end check against a booted stack
        env:
          RAILS_ENV: development
          E2E_BASE_URL: http://localhost:3000
          PAYMENT_PROVIDER: stripe
          STRIPE_API_BASE: http://localhost:12111
        run: |
          bin/rails db:prepare
          bin/rails db:seed
          mkdir -p tmp
          bin/rails server -p 3000 -d
          bin/jobs & echo $! > tmp/jobs.pid
          for _ in $(seq 1 45); do
            curl -sf http://localhost:3000/up > /dev/null && break
            sleep 2
          done
          bin/e2e

      - name: Show the log when something went wrong
        if: failure()
        run: tail -n 120 log/development.log || true

      - name: Stop the background processes
        if: always()
        run: |
          [ -f tmp/pids/server.pid ] && kill "$(cat tmp/pids/server.pid)" 2>/dev/null || true
          [ -f tmp/jobs.pid ] && kill "$(cat tmp/jobs.pid)" 2>/dev/null || true
